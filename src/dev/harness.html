<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Priority Assistant desktop demo</title>
  <link rel="icon" href="../icons/icon32.png">
  <style>
    /* A plain stand-in for the Gmail page, so the real extension UI can be tried with the demo mailbox. */
    html, body { margin: 0; height: 100%; font-family: "Segoe UI", system-ui, sans-serif; background: #f6f8fc; overflow: hidden; }
    .top { height: 64px; display: flex; align-items: center; gap: 14px; padding: 0 16px; }
    .brand { width: 232px; font-size: 21px; color: #444; display: flex; gap: 10px; align-items: center; }
    .brand b { color: #c5221f; }
    .search { flex: 1; max-width: 720px; height: 46px; border-radius: 28px; background: #e9eef6; display: flex; align-items: center; padding: 0 18px; color: #5f6368; }
    .side { position: absolute; top: 64px; left: 0; width: 240px; bottom: 0; padding: 4px 12px; }
    .compose { background: #c2e7ff; border-radius: 16px; height: 56px; width: 140px; display: flex; align-items: center; padding-left: 20px; margin-bottom: 12px; }
    .nav div { height: 32px; display: flex; align-items: center; padding-left: 22px; border-radius: 0 16px 16px 0; font-size: 14px; }
    .nav div.on { background: #d3e3fd; font-weight: 700; }
    [role=main] { position: absolute; top: 64px; left: 256px; right: 72px; bottom: 0; background: #fff; border-radius: 16px 16px 0 0; padding: 20px; color: #5f6368; }
    .rail { position: absolute; top: 64px; right: 0; width: 56px; bottom: 0; }
    /* ?dark: imitates Gmail's dark theme */
    body.dark { background: #111; color: #e8eaed; }
    body.dark .brand, body.dark .nav div { color: #e8eaed; }
    body.dark .search { background: #2a2a2a; color: #9aa0a6; }
    body.dark .compose { background: #2a3e57; color: #e8eaed; }
    body.dark .nav div.on { background: #2a3e57; }
    body.dark [role=main] { background: #1f1f1f; color: #9aa0a6; }
  </style>
</head>
<body>
  <div class="top" role="banner"><div class="brand"><b>✉</b> Mail (demo page)</div><div class="search">Search mail</div></div>
  <div class="side"><div class="compose">✎ Compose</div><div class="nav"><div class="on">Inbox</div><div>Starred</div><div>Snoozed</div><div>Sent</div><div>Drafts</div></div></div>
  <div role="main">This stands in for the normal Gmail inbox list. Press "Gmail view" in the overlay to see it.</div>
  <div class="rail"></div>
  <script type="module" src="harness.js"></script>
</body>
</html>
